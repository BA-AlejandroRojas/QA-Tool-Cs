<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BA Customer Service — QA Evaluation</title>
<link id="favicon" rel="icon" type="image/png" href="" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<div id="app"></div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --ink:#0f1729;--ink2:#475569;--mut:#94a3b8;--line:#e7e9ef;--bg:#f7f8fb;--card:#fff;--pri:#5b5bd6;--pri2:#4f46e5;
  --side:#0f1729;--side-txt:#cbd5e1;--side-hover:#1e293b;--track:#eef0f4;--soft:#f1f5f9;--soft2:#f7f8fb;
  --meet-fg:#0f766e;--meet-bg:#ecfdf5;--meet-ring:#5eead4;--meet:#10b981;
  --good-fg:#3730a3;--good-bg:#eef2ff;--good-ring:#a5b4fc;--good:#6366f1;
  --part-fg:#92400e;--part-bg:#fffbeb;--part-ring:#fcd34d;--part:#f59e0b;
  --na-fg:#475569;--na-bg:#f1f5f9;--na-ring:#cbd5e1;--na:#94a3b8;
  --fail-fg:#9f1239;--fail-bg:#fff1f2;--fail-ring:#fda4af;--fail:#f43f5e;
}
[data-theme="dark"]{
  --ink:#e8ecf3;--ink2:#9aa6b8;--mut:#64748b;--line:#232a3a;--bg:#0b0f17;--card:#131a26;--pri:#7c7cf0;--pri2:#6d6de8;
  --side:#080c13;--side-txt:#93a1b5;--side-hover:#1a2230;--track:#232a3a;--soft:#1a2230;--soft2:#151d2a;
  --meet-fg:#5eead4;--meet-bg:#0c2b26;--meet-ring:#134e48;--meet:#10b981;
  --good-fg:#a5b4fc;--good-bg:#1a1f3d;--good-ring:#312e81;--good:#818cf8;
  --part-fg:#fcd34d;--part-bg:#2b210c;--part-ring:#5b430f;--part:#f59e0b;
  --na-fg:#94a3b8;--na-bg:#1a2230;--na-ring:#334155;--na:#64748b;
  --fail-fg:#fda4af;--fail-bg:#2b0f16;--fail-ring:#5b1523;--fail:#f43f5e;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--bg);transition:background .25s,color .25s;}
.spin{animation:sp 1s linear infinite;}@keyframes sp{to{transform:rotate(360deg);}}
button{font-family:inherit;}
.shell{display:flex;height:100vh;overflow:hidden;}

/* sidebar */
.side{width:236px;flex:0 0 236px;background:var(--side);color:var(--side-txt);padding:20px 16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;gap:11px;align-items:center;}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;}
.brand-name{font-weight:800;font-size:15px;color:#fff;letter-spacing:-.2px;}
.brand-sub{font-size:11px;color:#64748b;margin-top:1px;}
.newbtn{display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:#0f1729;border:0;border-radius:9px;padding:10px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;}
.newbtn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.25);}
.nav{display:flex;flex-direction:column;gap:3px;}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;border:0;background:transparent;color:var(--side-txt);font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:.12s;}
.navitem:hover{background:var(--side-hover);}
.navitem.on{background:var(--side-hover);color:#fff;}
.navitem .lbl{flex:1;}
.badge{background:#6366f1;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;}
.themebtn{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--side-hover);color:var(--side-txt);border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;}
.themebtn:hover{background:var(--side-hover);}
.foot-note{font-size:11px;color:#64748b;line-height:1.5;}
.foot-note b{color:var(--side-txt);}

.main{flex:1;min-width:0;height:100vh;overflow-y:auto;}
.eval{display:flex;min-height:100%;}
.eval-body{flex:1;min-width:0;padding:26px 30px;max-width:1100px;}
.eval-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;}
.chtabs{display:inline-flex;background:var(--track);border-radius:10px;padding:3px;gap:2px;}
.chtab{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.12s;}
.chtab:disabled{opacity:.45;cursor:not-allowed;}
.chtab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.save-ind{font-size:12px;color:var(--meet);display:flex;align-items:center;gap:5px;font-weight:500;}

.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:22px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field span{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;}
.field select,.field input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink);outline:none;transition:.12s;}
.field select:focus,.field input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,91,214,.15);}
.field select:disabled,.field input:disabled{opacity:.6;}

.sections{display:flex;flex-direction:column;gap:12px;}
.section{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;}
.sec-head{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;cursor:pointer;color:var(--ink);}
.chev{color:var(--mut);transition:transform .18s;flex:0 0 auto;}
.chev.closed{transform:rotate(-90deg);}
.sec-name{font-weight:700;font-size:14px;}
.sec-max{font-size:11px;color:var(--mut);font-weight:600;background:var(--soft);padding:2px 8px;border-radius:20px;}
.sec-track{flex:1;height:6px;background:var(--track);border-radius:20px;overflow:hidden;max-width:170px;margin-left:auto;}
.sec-fill{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:20px;transition:width .3s;}
.sec-val{font-weight:700;font-size:14px;min-width:44px;text-align:right;}
.sec-slash{color:var(--mut);font-weight:500;font-size:12px;}
.sec-body{border-top:1px solid var(--line);}
.sec-body.hidden{display:none;}
.sec-inner{padding:6px 16px 14px;display:flex;flex-direction:column;}

.crit{padding:15px 0;border-bottom:1px solid var(--soft);}
.crit:last-child{border-bottom:0;}
.crit.fatal{background:var(--fail-bg);margin:0 -16px;padding:15px 16px;border-radius:9px;border-bottom:0;}
.crit-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;}
.crit-info{flex:1;min-width:0;}
.crit-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.crit-flag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--fail-fg);background:var(--fail-bg);padding:2px 7px;border-radius:5px;border:1px solid var(--fail-ring);}
.crit-desc{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.45;}
.seg{display:inline-flex;gap:4px;flex:0 0 auto;}
.seg-btn{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s;}
.seg-btn:hover{border-color:var(--mut);}
.seg-btn.on{color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.crit-tools{display:flex;align-items:center;gap:12px;margin-top:11px;flex-wrap:wrap;}
.weight{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink2);background:var(--soft);padding:3px 8px;border-radius:6px;}
.tool{display:flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:500;cursor:pointer;padding:3px 0;transition:.12s;}
.tool:hover{color:var(--pri);}
.tool.wide{width:100%;justify-content:center;background:var(--soft);padding:8px;border-radius:8px;margin-top:8px;}
.linkwrap{display:flex;align-items:center;gap:5px;color:var(--mut);flex:1;min-width:150px;}
.linkin{border:0;border-bottom:1px solid var(--line);background:transparent;font-size:12px;padding:2px 0;flex:1;outline:none;color:var(--ink);}
.linkin:focus{border-color:var(--pri);}
.evlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.ev{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--good-bg);color:var(--good-fg);padding:3px 8px;border-radius:6px;max-width:230px;}
.ev-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ev button{border:0;background:transparent;color:var(--good);cursor:pointer;display:flex;padding:0;}
.note{margin-top:10px;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:56px;outline:none;background:var(--card);color:var(--ink);}
.note:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,91,214,.12);}
.note.hidden{display:none;}

/* rail */
.rail{width:326px;flex:0 0 326px;background:var(--card);border-left:1px solid var(--line);padding:24px 22px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.gauge-wrap{position:relative;width:168px;height:168px;margin:0 auto 4px;}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;}
.gauge-num{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1;}
.gauge-num small{font-size:18px;font-weight:700;}
.gauge-rating{font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:20px;border:1px solid;}
.critbanner{display:flex;gap:8px;align-items:flex-start;background:var(--fail-bg);color:var(--fail-fg);font-size:11.5px;font-weight:500;padding:9px 11px;border-radius:9px;margin:12px 0;line-height:1.4;border:1px solid var(--fail-ring);}
.critbanner.hidden{display:none;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0;}
.stat{border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
.stat-top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);font-weight:600;}
.stat-v{font-size:20px;font-weight:800;margin-top:5px;letter-spacing:-.5px;}
.stat-sub{font-size:10.5px;color:var(--mut);margin-top:1px;}
.rec{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--soft2);border-radius:10px;margin-bottom:14px;}
.rec-k{font-size:12px;font-weight:600;color:var(--ink2);}
.rec-v{font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px;}
.rec-v.ok{color:var(--meet-fg);background:var(--meet-bg);}
.rec-v.warn{color:var(--part-fg);background:var(--part-bg);}
.pending{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:14px;}
.pending.hidden{display:none;}
.pending-h{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
.pending-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);padding:3px 0;}
.pending-row svg{color:var(--part);flex:0 0 auto;}
.pending-more{font-size:11px;color:var(--mut);margin-top:4px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;margin-bottom:14px;}
.status-pill[data-s="Draft"]{background:var(--soft);color:var(--ink2);}
.status-pill[data-s="Completed"]{background:var(--meet-bg);color:var(--meet-fg);}
.status-pill[data-s="Coaching"]{background:var(--part-bg);color:var(--part-fg);}
.finalize{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
.finalize:hover:not(:disabled){background:var(--pri2);transform:translateY(-1px);}
.finalize:disabled{background:var(--track);color:var(--mut);cursor:not-allowed;}
.finalize.alt{background:linear-gradient(135deg,#6366f1,#8b5cf6);}

.fb-note{font-size:11px;color:var(--part-fg);background:var(--part-bg);padding:7px 10px;border-radius:8px;margin-top:10px;}
.fb-out{margin-top:14px;display:flex;flex-direction:column;gap:14px;}
.fbsec-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;color:var(--ink2);}
.fbsec p{font-size:12.5px;line-height:1.55;margin:0;}
.fbsec ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px;}
.fbsec li{font-size:12.5px;line-height:1.5;}
.share{font-size:12.5px;line-height:1.6;background:var(--soft2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;}
.copy{margin-top:7px;border:0;background:var(--good-bg);color:var(--good-fg);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;}

/* pages */
.page{padding:28px 34px;max-width:1080px;}
.pagehead h1{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:0;}
.pagehead p{font-size:13.5px;color:var(--ink2);margin:5px 0 22px;}
.empty{display:grid;place-items:center;min-height:100vh;padding:30px;}
.empty-card{max-width:440px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:38px 34px;}
.empty-icon{width:52px;height:52px;border-radius:13px;background:var(--good-bg);color:var(--pri);display:grid;place-items:center;margin:0 auto 18px;}
.empty-card h1{font-size:20px;font-weight:800;margin:0 0 10px;letter-spacing:-.4px;}
.empty-card p{font-size:13.5px;color:var(--ink2);line-height:1.6;margin:0 0 22px;}
.primary{display:inline-flex;align-items:center;gap:8px;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
.primary:hover{background:var(--pri2);transform:translateY(-1px);}
.emptynote{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:34px;text-align:center;color:var(--mut);font-size:13.5px;}
.emptynote.sm{padding:22px;font-size:12.5px;}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:18px;color:var(--mut);max-width:340px;}
.searchbar input{border:0;outline:none;font-size:13px;font-family:inherit;flex:1;color:var(--ink);background:transparent;}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.agcard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;cursor:pointer;text-align:left;transition:.15s;}
.agcard:hover{border-color:var(--pri);box-shadow:0 4px 14px rgba(15,23,41,.10);transform:translateY(-1px);}
.ag-av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid;flex:0 0 auto;}
.ag-info{flex:1;min-width:0;}
.ag-name{font-weight:700;font-size:14px;}
.ag-meta{font-size:12px;color:var(--mut);margin-top:1px;}
.ag-score{font-size:19px;font-weight:800;letter-spacing:-.5px;}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:16px;}
.back:hover{color:var(--pri);}
.prof-head{display:flex;align-items:center;gap:15px;margin-bottom:22px;}
.prof-av{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;}
.prof-head h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.5px;}
.prof-sub{font-size:13px;color:var(--ink2);margin-top:2px;}
.delta{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 13px;border-radius:20px;}
.delta.up{color:var(--meet-fg);background:var(--meet-bg);}
.delta.down{color:var(--fail-fg);background:var(--fail-bg);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;}
.card.span2{grid-column:span 2;}
.card-h{font-size:12.5px;font-weight:700;margin-bottom:14px;letter-spacing:-.1px;}
.patrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:12.5px;}
.patrow:last-child{border-bottom:0;}
.patcount{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
.table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--line);}
.table td{padding:11px 12px;border-bottom:1px solid var(--soft);}
.table td.cap{text-transform:capitalize;}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid;}
.status-mini{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.status-mini[data-s="Completed"]{background:var(--meet-bg);color:var(--meet-fg);}
.status-mini[data-s="Coaching"]{background:var(--part-bg);color:var(--part-fg);}
.del{border:0;background:transparent;color:var(--mut);cursor:pointer;padding:4px;}
.del:hover{color:var(--fail);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 17px;}
.kpi-l{font-size:11.5px;color:var(--ink2);font-weight:600;}
.kpi-v{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:5px;}
.kpi-v.sm{font-size:15px;letter-spacing:-.3px;line-height:1.3;margin-top:8px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px;}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);}
.legend i{width:9px;height:9px;border-radius:3px;}
.total-pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 13px;border-radius:20px;margin-bottom:14px;}
.total-pill.ok{background:var(--meet-bg);color:var(--meet-fg);}
.total-pill.warn{background:var(--part-bg);color:var(--part-fg);}
.set-sec-h{font-size:12px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.5px;padding:12px 0 6px;}
.set-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--soft);}
.set-name{flex:1;font-size:13px;font-weight:500;}
.set-crit{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-weight:600;}
.set-w{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:600;}
.set-w input{width:62px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;font-family:inherit;text-align:right;outline:none;background:var(--card);color:var(--ink);}
.set-w input:focus{border-color:var(--pri);}
.set-actions{display:flex;align-items:center;gap:14px;margin-top:18px;}
.chart-bar-lbl{font-size:10px;fill:var(--mut);}
.combo{position:relative;}
.combo-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 10px;font-size:13px;background:var(--card);color:var(--ink);outline:none;font-family:inherit;}
.combo-input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,91,214,.15);}
.combo-input:disabled{opacity:.6;}
.combo-caret{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;display:flex;}
.combo-menu{position:absolute;z-index:60;top:calc(100% + 4px);left:0;right:0;max-height:230px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,23,41,.18);padding:4px;}
.combo-menu.hidden{display:none;}

.combo-empty{padding:9px 10px;font-size:12.5px;color:var(--mut);}
.reset-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s;flex:0 0 auto;}

.filters .field input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,91,214,.15);}
.filters .clearf{border:0;background:transparent;color:var(--pri);font-size:12.5px;font-weight:600;cursor:pointer;padding:9px 4px;}

.dlbtn{display:inline-flex;align-items:center;gap:7px;background:var(--pri);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;}

/* ------------------------------- login screen ---------------------------- */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% 10%,#1e1b4b 0%,#0f1729 55%,#0b0f17 100%);padding:24px;}
.login-card{width:100%;max-width:420px;background:var(--card);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;}
.login-top{background:linear-gradient(135deg,#4f46e5,#8b5cf6);padding:34px 32px 28px;color:#fff;text-align:center;}
.login-logo{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 14px;color:#fff;}
.login-top h1{font-size:19px;font-weight:800;margin:0;letter-spacing:-.3px;}
.login-top p{font-size:12.5px;color:#e0e7ff;margin:6px 0 0;}
.login-body{padding:28px 32px 30px;display:flex;flex-direction:column;gap:16px;}
.login-step-lbl{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;}
.login-name-pill{display:flex;align-items:center;justify-content:space-between;background:var(--soft2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.5px;font-weight:600;}
.login-name-pill button{border:0;background:transparent;color:var(--pri);font-size:12px;font-weight:600;cursor:pointer;}
.login-pin{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:20px;letter-spacing:6px;text-align:center;font-family:inherit;font-weight:700;outline:none;background:var(--card);color:var(--ink);}
.login-pin:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,91,214,.15);}
.login-hint{font-size:11.5px;color:var(--mut);line-height:1.5;text-align:center;}
.login-err{font-size:12px;color:var(--fail-fg);background:var(--fail-bg);border:1px solid var(--fail-ring);border-radius:8px;padding:8px 11px;text-align:center;}
.login-btn{width:100%;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;}
.login-btn:hover:not(:disabled){background:var(--pri2);transform:translateY(-1px);}
.login-btn:disabled{background:var(--track);color:var(--mut);cursor:not-allowed;}
.login-remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);}
.login-forgot{font-size:11.5px;color:var(--mut);text-align:center;}
.login-forgot button{border:0;background:transparent;color:var(--pri);font-weight:600;cursor:pointer;font-size:11.5px;}
.login-foot{font-size:10.5px;color:var(--mut);text-align:center;padding:14px 32px 22px;line-height:1.5;border-top:1px solid var(--line);}
.session-pill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--side-txt);padding:8px 3px;}
.session-pill b{color:#fff;font-weight:700;}
.logoutbtn{border:0;background:transparent;color:#64748b;font-size:11px;font-weight:600;cursor:pointer;margin-left:auto;}
.logoutbtn:hover{color:#f87171;}

/* ------------------------------- quarterly agent report ------------------ */
.qtr-wrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.qtr-grid{display:grid;grid-template-columns:180px repeat(3,1fr);}
.qtr-headcell{background:#1e1b4b;color:#fff;font-weight:800;font-size:14px;padding:14px 10px;text-align:center;}
.qtr-label{background:var(--soft2);padding:14px 15px;border-top:1px solid var(--line);}
.qtr-label b{font-size:13.5px;font-weight:800;color:var(--ink);display:block;margin-bottom:5px;}
.qtr-label small{font-size:11px;color:var(--ink2);font-style:italic;line-height:1.4;display:block;}
.qtr-cell{padding:13px 14px;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:12px;color:var(--ink);}
.qtr-cell ul{margin:0;padding-left:0;display:flex;flex-direction:column;gap:5px;list-style:none;}
.qtr-cell li{display:flex;align-items:center;}
.qtr-empty{color:var(--mut);font-style:italic;font-size:11.5px;}
.qtr-score{padding:16px 14px;border-top:1px solid var(--line);border-left:1px solid var(--line);text-align:center;font-size:21px;font-weight:800;color:var(--pri);background:var(--soft2);}
.qtr-score .qtr-count{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:3px;}
.risk-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:0 0 auto;}
.risk-red{background:#f43f5e;}
.risk-yellow{background:#f59e0b;}
.risk-green{background:#10b981;}
.qtr-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink2);}
.qtr-legend span{display:flex;align-items:center;}
.qtr-legend i{margin-right:5px;}

/* ------------------------------- coaching queue --------------------------- */
.fu-tabs{display:inline-flex;background:var(--track);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px;}
.fu-tab{border:0;background:transparent;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;}
.fu-tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.fu-group-h{font-size:12px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;}
.fu-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.fu-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.fu-agent{font-weight:700;font-size:14px;}
.fu-meta{font-size:12px;color:var(--ink2);}
.fu-age{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:auto;}
.fu-age.new{color:var(--meet-fg);background:var(--meet-bg);}
.fu-age.warn{color:var(--part-fg);background:var(--part-bg);}
.fu-age.old{color:var(--fail-fg);background:var(--fail-bg);}
.fu-actions{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap;}
.fu-select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--ink);}
.fu-note{margin-top:9px;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;resize:vertical;min-height:44px;background:var(--card);color:var(--ink);}
.fu-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.fu-status[data-s="Pending"]{background:var(--fail-bg);color:var(--fail-fg);}
.fu-status[data-s="Scheduled"]{background:var(--part-bg);color:var(--part-fg);}
.fu-status[data-s="Completed"]{background:var(--meet-bg);color:var(--meet-fg);}

/* ------------------------------- calibration ------------------------------ */
.calib-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:10px;cursor:pointer;transition:.15s;}
.calib-card:hover{border-color:var(--pri);box-shadow:0 4px 14px rgba(15,23,41,.08);}

.calib-meta{font-size:12px;color:var(--ink2);margin-top:3px;}
.calib-agree{font-size:18px;font-weight:800;letter-spacing:-.4px;}
.participant-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--soft);font-size:13px;}
.participant-row:last-child{border-bottom:0;}
.part-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.part-pill.done{background:var(--meet-bg);color:var(--meet-fg);}
.part-pill.wait{background:var(--soft);color:var(--mut);}
.calib-table{width:100%;border-collapse:collapse;font-size:12.5px;}

.calib-cell{display:inline-flex;align-items:center;gap:5px;font-weight:700;padding:3px 9px;border-radius:7px;}

.imp-name{font-weight:700;font-size:13.5px;}
.imp-meta{font-size:12px;color:var(--ink2);margin-top:2px;}
.imp-warn{font-size:11px;color:var(--part-fg);margin-top:2px;}
.imp-sheet{font-size:11.5px;color:var(--mut);white-space:nowrap;}

/* =============================== STORAGE ================================== */
/* NOTE: get/set/del/list now accept an explicit `shared` flag.
   - Personal (shared=false, default): theme, in-progress drafts.
   - Shared/team (shared=true): finalized evaluations, rubric configuration.
   This lets a whole QA team see each other's finalized evaluations and
   work off the same scoring rubric, instead of every evaluator only
   seeing their own isolated data. */
const mem={};
const store={
 async get(k,shared){try{if(window.storage){const r=await window.storage.get(k,!!shared);return r?r.value:(mem[k]??null);}}catch(e){} return mem[k]??null;},
 async set(k,v,shared){mem[k]=v;try{if(window.storage)await window.storage.set(k,v,!!shared);}catch(e){}},
 async del(k,shared){delete mem[k];try{if(window.storage)await window.storage.delete(k,!!shared);}catch(e){}},
 async list(p,shared){try{if(window.storage){const r=await window.storage.list(p,!!shared);return (r&&r.keys)||[];}}catch(e){} return Object.keys(mem).filter(k=>k.startsWith(p));}
};

/* =============================== SESSION / LOGIN ===========================
   IMPORTANT: this is a lightweight identity gate, NOT real authentication.
   There is no backend server here — the "PIN" is just a client-side deterrent
   (a non-cryptographic hash) to reduce accidental impersonation on a shared
   device. Anyone who can read this file's source can bypass it. It exists so
   each evaluator can be recognized by name and have it pre-filled/attributed,
   not to gate access to sensitive data. */
function simpleHash(s){s=String(s);let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return (h>>>0).toString(36);}
async function getAuth(name){const v=await store.get("qa:auth:"+name,true);if(!v)return null;try{return JSON.parse(v);}catch(e){return null;}}
async function setAuth(name,pin){await store.set("qa:auth:"+name,JSON.stringify({hash:simpleHash(name.toLowerCase()+":"+pin)}),true);}
async function checkAuth(name,pin){const a=await getAuth(name);if(!a)return false;return a.hash===simpleHash(name.toLowerCase()+":"+pin);}
async function loadSession(){const v=await store.get("qa:session",false);if(!v)return null;try{return JSON.parse(v);}catch(e){return null;}}
async function persistSession(name){await store.set("qa:session",JSON.stringify({evaluator:name,ts:Date.now()}),false);}
async function clearSession(){await store.del("qa:session",false);}

/* =============================== SCORING ================================== */
/* N/A now scores the same as "Meets" (full credit) rather than being excluded
   from the denominator — a non-applicable criterion should not drag the
   score down or be treated as a gap. */
function scoreValue(r,w){return (r==="Yes"||r==="NA")?w:r==="Partially"?w/2:0;}
function computeScore(schema,channel,responses){
 const secs=schema.channels[channel].sections;let earned=0,applicable=0,answered=0,total=0,criticalFail=false;
 const pending=[],failed=[],sectionBreakdown=[];
 for(const sec of secs){let se=0,sa=0;
  for(const c of sec.criteria){total++;const v=responses[c.id]&&responses[c.id].value;
   if(!v){pending.push({section:sec.name,name:c.name});continue;}
   answered++;
   sa+=c.weight;applicable+=c.weight;const g=scoreValue(v,c.weight);se+=g;earned+=g;
   if(v==="No"){failed.push({id:c.id,section:sec.name,name:c.name,critical:!!c.critical});if(c.critical)criticalFail=true;}}
  sectionBreakdown.push({id:sec.id,name:sec.name,earned:se,applicable:sa});}
 let pct=applicable>0?(100*earned)/applicable:0;if(criticalFail)pct=0;
 return{pct:Math.round(pct*10)/10,earned,applicable,answered,total,pending,failed,criticalFail,sectionBreakdown};}

 if(r==="T1"||r==="New Hire"){if(pct>=90)return"Excellent";if(pct>=80)return"Good";if(pct>=75)return"Satisfactory";if(pct>=50)return"Needs Improvement";return"Unsatisfactory";}
 if(r==="T2"){if(pct>=100)return"Excellent";if(pct>=90)return"Good";if(pct>=80)return"Satisfactory";if(pct>=60)return"Needs Improvement";return"Unsatisfactory";}
 if(pct>=100)return"Excellent";if(pct>=90)return"Good";if(pct>=75)return"Needs Improvement";return"Unsatisfactory";}

/* American date format MM/DD/YYYY, used everywhere a specific date is shown
   (month/year labels like "January 2026" are left as-is, those aren't dates). */
function fmtDateUS(d){
 if(!d)return "—";
 const dt=(d instanceof Date)?d:new Date(typeof d==="string"&&d.indexOf("T")<0?d+"T00:00:00":d);
 if(isNaN(dt.getTime()))return String(d);
 return String(dt.getMonth()+1).padStart(2,"0")+"/"+String(dt.getDate()).padStart(2,"0")+"/"+dt.getFullYear();
}
function fmtDateTimeUS(d){
 const dt=(d instanceof Date)?d:new Date(d);
 if(isNaN(dt.getTime()))return String(d);
 let h=dt.getHours();const ampm=h>=12?"PM":"AM";h=h%12;if(h===0)h=12;
 return fmtDateUS(dt)+", "+h+":"+String(dt.getMinutes()).padStart(2,"0")+" "+ampm;
}

async function persistEval(ev){
 if(ev.status==="Draft"){

     half-filled-out evaluation, and it avoids collisions on shared keys. */
  await store.set("qa:draft:"+ev.id,JSON.stringify(ev),false);

 }
 const others=S.evals.filter(e=>e.id!==ev.id);S.evals=[ev,...others].sort((a,b)=>a.createdAt<b.createdAt?1:-1);

   Follow-up) automatically gets a follow-up record so it doesn't get lost.
   One active (non-Completed) follow-up per evaluation — if the evaluation is
   edited and improves out of Coaching, the follow-up record simply stays as
   history but a fresh one won't be created unless it drops back into Coaching. */
async function persistFollowup(f){

async function ensureFollowup(ev){

}

function wireCombo(id,options,current,onSelect){
 const input=document.getElementById("ci-"+id),menu=document.getElementById("cm-"+id);if(!input||!menu)return;
 let filtered=options.slice(),active=-1,committed=current||"";

  menu.innerHTML=filtered.length?filtered.map((o,i)=>'<div class="combo-opt '+(o===committed?"sel":"")+(i===active?" active":"")+'" data-v="'+esc(o)+'">'+esc(o)+'</div>').join(""):'<div class="combo-empty">No matches</div>';};
 const open=()=>{menu.classList.remove("hidden");active=-1;paint();};

 const scroll=()=>{const el=menu.querySelector(".combo-opt.active");if(el)el.scrollIntoView({block:"nearest"});};
 input.addEventListener("focus",open);
 input.addEventListener("input",()=>{active=-1;menu.classList.remove("hidden");paint();});
 input.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();active=Math.min(active+1,filtered.length-1);paint();scroll();}
  else if(e.key==="ArrowUp"){e.preventDefault();active=Math.max(active-1,0);paint();scroll();}
  else if(e.key==="Enter"){e.preventDefault();if(active>=0&&filtered[active])commit(filtered[active]);else if(filtered.length===1)commit(filtered[0]);}

 menu.addEventListener("mousedown",e=>{const o=e.target.closest(".combo-opt");if(o){e.preventDefault();commit(o.dataset.v);}});

function readImageScaled(file,maxDim,quality){maxDim=maxDim||1000;quality=quality||0.72;
 return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(fr.error);
  fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error("img"));
   img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,maxDim/Math.max(w,h));const cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
    const c=document.createElement("canvas");c.width=cw;c.height=ch;const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);
    res({dataUrl:c.toDataURL("image/jpeg",quality),w:cw,h:ch});};
   img.src=fr.result;};
  fr.readAsDataURL(file);});}

  /* Keep any answered criterion whose id also exists in the new channel's

     wiping the whole form on an accidental tab click. */
  const newCritIds=new Set();
  S.schema.channels[ch].sections.forEach(s=>s.criteria.forEach(c=>newCritIds.add(c.id)));
  const kept={},dropped=[];
  Object.entries(S.draft.responses).forEach(([id,r])=>{
   if(newCritIds.has(id))kept[id]=r;else dropped.push(id);
  });
  if(dropped.length&&!confirm(dropped.length+" response(s) don't exist in the new channel and will be lost. The rest of your responses are kept. Continue?"))return;
  S.draft.channel=ch;S.draft.responses=kept;S.draft.openSecs={};render();scheduleSave();

 /* ---- editing a finalized evaluation ---- */
 startEdit(){
  const ev=S.draft;if(!ev||ev.status==="Draft")return;
  ev._editSnapshot=JSON.parse(JSON.stringify({responses:ev.responses,account:ev.account,interactionId:ev.interactionId,interactionDate:ev.interactionDate,evalDate:ev.evalDate}));
  ev.editUnlocked=true;render();
 },
 cancelEdit(){
  const ev=S.draft;if(!ev||!ev._editSnapshot)return;
  if(!confirm("Discard the changes made in this edit?"))return;
  clearTimeout(S._saveT);
  const snap=ev._editSnapshot;
  ev.responses=snap.responses;ev.account=snap.account;ev.interactionId=snap.interactionId;ev.interactionDate=snap.interactionDate;ev.evalDate=snap.evalDate;
  ev.editUnlocked=false;delete ev._editSnapshot;render();
 },
 saveEdit(){
  const ev=S.draft;if(!ev||!ev._editSnapshot)return;
  clearTimeout(S._saveT);
  const snap=ev._editSnapshot,changes=[];
  [["account","Account #"],["interactionId","Interaction ID"],["interactionDate","Interaction date"],["evalDate","Evaluation date"]].forEach(([key,label])=>{
   const a=snap[key]||"",b=ev[key]||"";if(a!==b)changes.push(label+': "'+(a||"—")+'" \u2192 "'+(b||"—")+'"');
  });
  const critNames={};effectiveSchema(ev).channels[ev.channel].sections.forEach(s=>s.criteria.forEach(c=>critNames[c.id]=c.name));
  const oldResp=snap.responses||{},newResp=ev.responses||{};
  const allIds=new Set([...Object.keys(oldResp),...Object.keys(newResp)]);
  allIds.forEach(id=>{
   const ov=(oldResp[id]||{}).value,nv=(newResp[id]||{}).value,name=critNames[id]||id;
   if(ov!==nv)changes.push(name+": "+(ov||"sin respuesta")+" \u2192 "+(nv||"sin respuesta"));
   const oc=(oldResp[id]||{}).comment||"",nc=(newResp[id]||{}).comment||"";
   if(oc!==nc)changes.push('Comentario actualizado en "'+name+'"');
  });
  if(!changes.length){ev.editUnlocked=false;delete ev._editSnapshot;render();return;}
  const sc=computeScore(effectiveSchema(ev),ev.channel,ev.responses),rating=ratingFor(ev.role,sc.pct),rec=recommendationFor(sc.pct);
  const newStatus=(rating==="Needs Improvement"||rating==="Unsatisfactory")?"Coaching":"Completed";
  if(ev.status!==newStatus)changes.push("Estado: "+ev.status+" \u2192 "+newStatus);
  ev.finalPct=sc.pct;ev.rating=rating;ev.recommendation=rec;ev.status=newStatus;
  ev.changeLog=ev.changeLog||[];
  ev.changeLog.push({ts:new Date().toISOString(),by:(S.session&&S.session.evaluator)||"—",desc:changes.join("; ")});
  ev.editUnlocked=false;delete ev._editSnapshot;
  persistEval(ev);render();
 },

function localFeedback(ev,sc,rating,rec){

  suggestedFeedback:"Hi "+(ev.agent||"there")+", on your recent "+ev.channel+" interaction you scored "+sc.pct+"% ("+rating+"). "+(gaps.length?"Let's focus on: "+gaps.join(", ")+".":"Great consistency — keep it up.")};
}

function scheduleSave(){
 /* Capture the draft reference at schedule-time, not at fire-time, so a
    fast view switch (new eval / navigation) right before the debounce
    fires can never overwrite the wrong evaluation. */
 const ev=S.draft;
 clearTimeout(S._saveT);
 S._saveT=setTimeout(()=>{
  if(ev.editUnlocked){
   /* Don't silently persist mid-edit changes to an already-finalized
      evaluation — only "Guardar cambios" commits them, with a change-log
      entry. Just show a local "unsaved edits" indicator instead. */
   const si=document.getElementById("saveind");if(si)si.innerHTML=ic("dot",13)+" Unsaved edits";
   return;
  }
  persistEval(ev);
  const si=document.getElementById("saveind");if(si)si.innerHTML=ic("check2",13)+" Autosaved";
 },700);
}

function agentStats(name,ym){const rows=S.evals.filter(e=>e.agent===name&&e.status!=="Draft"&&(!ym||(e.evalDate||e.createdAt||"").slice(0,7)===ym)).map(r=>Object.assign({},r,{pct:r.finalPct||0}));
 rows.sort((a,b)=>a.createdAt<b.createdAt?1:-1);const avg=rows.length?Math.round(rows.reduce((s,r)=>s+r.pct,0)/rows.length):0;return{rows,avg,count:rows.length};}
function scoreTone(v){return v>=90?"meet":v>=80?"good":v>=60?"part":"fail";}
function filteredAgents(){
 const F=S.agentFilters||(S.agentFilters={agent:"",month:"",minEvals:0});
 const names=[...new Set(S.evals.filter(e=>e.status!=="Draft").map(e=>e.agent))];
 return names.map(a=>Object.assign({name:a},agentStats(a,F.month)))
   .filter(a=>a.count>0).filter(a=>!F.agent||a.name===F.agent).filter(a=>a.count>=(F.minEvals||0))
   .sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
}

  '<div style="font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--pri)">'+sc.composite+'<span style="font-size:16px">%</span></div>'+
  '<span class="tag" style="color:'+t.fg+';background:'+t.bg+';border-color:'+t.ring+'">'+esc(sc.rating)+'</span>'+
  '<div style="font-size:12.5px;color:var(--ink2)"><b>'+sc.rec+'</b> · '+sc.evs.length+' evaluation'+(sc.evs.length!==1?"s":"")+'</div>'+
  '<div style="margin-left:auto;font-size:12px;color:var(--mut)">'+(sc.byChannel.map(c=>c.channel+' '+c.avg+'% ('+c.count+')').join(" · ")||"")+'</div></div>';
 const tagTone={Strength:"meet",Observe:"part",Improve:"fail"};
 const rows=sc.criteria.map(c=>{const tt=toneVars(tagTone[c.tag]);return '<div class="patrow"><span>'+esc(c.label)+' <span style="color:var(--mut)">· '+c.channel+' ×'+c.timesEvaluated+'</span></span><span class="patcount" style="color:'+tt.fg+';background:'+tt.bg+'">'+c.tag+' · '+c.avgPct+'%</span></div>';}).join("");
 return head+rows;
}

act.handleImportFile=async function(input){
 const file=input.files[0];input.value="";
 if(!file)return;
 if(!window.XLSX){alert("The Excel library did not load. Try again in a moment.");return;}
 try{
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});

  if(!rows.length){alert("No completed evaluations were found in this file (Phone/Chat/Email sheets are blank or use a different format than expected).");return;}
  S.importPreview=rows;S.importFileName=file.name;render();
 }catch(e){alert("Could not read the file: "+e.message);}
};

/* Bulk export: several agents × a free date range -> ZIP with
   Agent/Month/*.pdf plus an Agent/"Overall Feedback"/*.pdf per agent. */
act.downloadBulkZip=async function(){
 const B=S.bulk||{agents:[]};
 if(!B.agents.length){alert("Select at least one agent.");return;}
 const fromEl=document.getElementById("bulk-from"),toEl=document.getElementById("bulk-to");
 const from=(fromEl&&fromEl.value)||B.from||"",to=(toEl&&toEl.value)||B.to||"";
 if(!from||!to){alert("Select a month range (From/To).");return;}
 if(from>to){alert("The 'From' month must be on or before the 'To' month.");return;}
 if(!(window.jspdf&&window.jspdf.jsPDF)){alert("The PDF library did not load. Try again in a moment.");return;}
 if(!window.JSZip){alert("The ZIP library did not load. Try again in a moment.");return;}
 const btn=document.getElementById("bulkzipbtn"),label=btn?btn.innerHTML:"";if(btn){btn.disabled=true;btn.innerHTML="Generating… (0/"+B.agents.length+")";}
 try{
  const zip=new JSZip();let done=0,anyFile=false;
  for(const name of B.agents){
   const safe=name.replace(/[^a-z0-9]+/gi,"_")||"agent";
   const evs=S.evals.filter(e=>e.agent===name&&e.status!=="Draft"&&inRangeMonth(monthKey(e.evalDate||e.createdAt),from,to));
   if(evs.length){
    const byMonth={};
    evs.forEach(e=>{const mk=monthKey(e.evalDate||e.createdAt);(byMonth[mk]=byMonth[mk]||[]).push(e);});
    Object.keys(byMonth).sort().forEach(mk=>{
     const folder=monthFolderName(mk);
     byMonth[mk].forEach(e=>{const doc=buildInteractionDoc(e);if(doc){zip.file(safe+"/"+folder+"/"+interactionFilename(e),doc.output("arraybuffer"));anyFile=true;}});
    });
    const overallDoc=buildAgentScorecardDoc(name,from,to);
    if(overallDoc){zip.file(safe+"/Overall Feedback/"+scorecardFilename(name,from,to),overallDoc.output("arraybuffer"));anyFile=true;}
   }
   done++;if(btn)btn.innerHTML="Generating… ("+done+"/"+B.agents.length+")";
  }
  if(!anyFile){alert("None of the selected agents have finalized evaluations in that month range.");return;}
  const content=await zip.generateAsync({type:"blob"});
  const url=URL.createObjectURL(content),link=document.createElement("a");
  link.href=url;link.download="BACS_Bulk_"+from+"_to_"+to+".zip";
  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){alert("Error generating the ZIP: "+e.message);}
 finally{if(btn){btn.disabled=false;btn.innerHTML=label;}}
};

 const agentFollowups=S.followups.filter(f=>f.agent===name);

 ).join(""):'<div class="emptynote sm">No coaching follow-ups for this agent.</div>';

function calibAgreement(c){
 const submitted=c.participants.filter(p=>c.responses[p]);
 if(submitted.length<2)return null;
 const schema=S.schema.channels[c.channel];if(!schema)return null;
 const criteria=schema.sections.flatMap(s=>s.criteria);
 let agree=0;
 criteria.forEach(cr=>{
  const vals=submitted.map(p=>(c.responses[p][cr.id]||{}).value||"—");
  if(new Set(vals).size===1)agree++;
 });
 return{pct:Math.round((agree/criteria.length)*100),total:criteria.length,agree};
}

/* -------------------- quarterly per-agent report (Analytics) -------------- */
const MESES_ES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MESES_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthKey(dstr){return (dstr||"").slice(0,7);}
function monthLabelEs(key){const m=parseInt((key||"").split("-")[1],10);return MESES_ES[(m-1+12)%12]||key;}
function monthLabelEn(key){const[y,m]=(key||"").split("-");return MESES_EN[(parseInt(m,10)-1+12)%12]+" "+y;}
function lastNMonthKeys(n){const out=[],d=new Date();
 for(let i=n-1;i>=0;i--){const dt=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"));}
 return out;}
/* Last N calendar months, with the agent's most frequent met (Yes) and missed
   (No) criteria that month, the average score, and a recurrence-risk tag
   (red/yellow/green) computed across the whole shown period so the same
   criterion carries a consistent color everywhere it appears. */
function agentQuarterData(name,n){
 n=n||3;
 const months=lastNMonthKeys(n);
 const perMonth=months.map(mk=>{
  const evs=S.evals.filter(e=>e.agent===name&&e.status!=="Draft"&&monthKey(e.evalDate||e.createdAt)===mk);
  const strengthCount={},gapCount={};
  evs.forEach(e=>{const secs=(e.schemaSnapshot?e.schemaSnapshot.sections:(S.schema.channels[e.channel]?S.schema.channels[e.channel].sections:[]));const byId={};secs.forEach(s=>s.criteria.forEach(c=>byId[c.id]=c.name));
   Object.entries(e.responses||{}).forEach(([id,r])=>{const nm=byId[id]||id;if(r.value==="Yes")strengthCount[nm]=(strengthCount[nm]||0)+1;if(r.value==="No")gapCount[nm]=(gapCount[nm]||0)+1;});});
  const avg=evs.length?Math.round(evs.reduce((s,e)=>s+(e.finalPct||0),0)/evs.length):null;
  return{month:mk,label:monthLabelEs(mk),count:evs.length,avg,strengthCount,gapCount};
 });
 const dataMonths=perMonth.filter(m=>m.count>0).map(m=>m.month);
 const lastDataMonth=dataMonths[dataMonths.length-1];
 const gapFreq={};
 perMonth.forEach(m=>{Object.keys(m.gapCount).forEach(nm=>{const f=gapFreq[nm]=gapFreq[nm]||{monthsCount:0,inLast:false};f.monthsCount++;if(m.month===lastDataMonth)f.inLast=true;});});
 const riskOf=nm=>{const f=gapFreq[nm];if(!f)return"green";if(f.monthsCount>=2&&f.inLast)return"red";if(f.monthsCount>=2)return"yellow";if(f.inLast)return"yellow";return"green";};
 const top=(obj)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
 return perMonth.map(m=>({month:m.month,label:m.label,count:m.count,avg:m.avg,
  strengths:top(m.strengthCount),
  gaps:top(m.gapCount).map(nm=>({name:nm,risk:riskOf(nm)}))}));
}
/* Full monthly average history for an agent, used to plot the improvement trend. */
function agentTrendData(name){
 const byMonth={};
 S.evals.filter(e=>e.agent===name&&e.status!=="Draft").forEach(e=>{const mk=monthKey(e.evalDate||e.createdAt);(byMonth[mk]=byMonth[mk]||[]).push(e.finalPct||0);});
 return Object.keys(byMonth).sort().map(k=>({month:k,label:monthLabelEs(k),avg:Math.round(byMonth[k].reduce((s,x)=>s+x,0)/byMonth[k].length)}));
}

 const gapList=arr=>arr.length?('<ul>'+arr.map(g=>'<li><span class="risk-dot risk-'+g.risk+'"></span>'+esc(g.name)+'</li>').join("")+'</ul>'):'<span class="qtr-empty">Sin evaluaciones</span>';

function buildQuarterlyReportDoc(name,n){
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
 const q=agentQuarterData(name,n),trend=agentTrendData(name);
 const doc=new J({unit:"mm",format:"a4"});

 const rgb=h=>{h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
 const F=h=>doc.setFillColor.apply(doc,rgb(h)),T=h=>doc.setTextColor.apply(doc,rgb(h)),D=h=>doc.setDrawColor.apply(doc,rgb(h));
 const font=(s,w)=>{doc.setFont("helvetica",w||"normal");doc.setFontSize(s);};
 let y=0;

act.saveSchema=function(){
 wireSettings.collect&&wireSettings.collect();
 const sch=S._settingsDraft;
 if(!sch)return;
 /* Guard against silently saving a rubric whose weights don't add up to
    100 per channel — that would make future scores non-comparable with
    past ones and break the % math in subtle ways. */
 const bad=Object.entries(sch.channels)
  .map(([k,c])=>({label:c.label,total:c.sections.reduce((s,sec)=>s+sec.criteria.reduce((a,cr)=>a+cr.weight,0),0)}))
  .filter(x=>x.total!==100);

  const msg="The following channels don't add up to 100 points: "+bad.map(b=>b.label+" ("+b.total+")").join(", ")+
   ". This can make scores non-comparable across evaluations. Save anyway?";
  if(!confirm(msg))return;

/* =============================== EXCEL IMPORT ==============================
   Reads a legacy QA_Form.xlsx-style workbook (one sheet per interaction,
   named "Phone QA N" / "Chat QA N" / "Email N") and turns each filled-in
   sheet into a finalized evaluation, using the exact same row layout the
   original workbook always used: criterion rows at fixed positions
   (6,8,9,11,12,13,15,16) in the same order as this app's own rubric for
   that channel. Empty template sheets (no agent name in B2) are skipped. */
function detectChannelFromSheetName(name){
 const n=(name||"").trim().toLowerCase();
 if(n.startsWith("phone"))return "phone";
 if(n.startsWith("chat"))return "chat";
 if(n.startsWith("email"))return "email";
 return null;
}
function normalizeQAValue(v){
 if(v==null)return "";
 const low=String(v).trim().toLowerCase();
 if(low==="yes")return "Yes";
 if(low==="partially"||low==="partial")return "Partially";
 if(low==="na"||low==="n/a")return "NA";
 if(low==="no"||low==="fail")return "No";
 return "";
}
function excelCellDateToISO(v){
 if(v instanceof Date&&!isNaN(v.getTime()))return v.toISOString().slice(0,10);
 if(typeof v==="number"&&window.XLSX&&XLSX.SSF&&XLSX.SSF.parse_date_code){
  const d=XLSX.SSF.parse_date_code(v);
  if(d)return String(d.y).padStart(4,"0")+"-"+String(d.m).padStart(2,"0")+"-"+String(d.d).padStart(2,"0");
 }
 return "";
}
function isDuplicateImportRow(row){
 return S.evals.some(e=>e.status!=="Draft"&&e.agent===row.agent&&e.channel===row.channel&&
  ((row.interactionId&&e.interactionId===row.interactionId)||
   (!row.interactionId&&e.evalDate===row.evalDate&&e.account===row.account)));
}
function parseWorkbookToEvaluations(wb){
 const out=[],rowNums=[6,8,9,11,12,13,15,16];
 (wb.SheetNames||[]).forEach(sheetName=>{
  const channel=detectChannelFromSheetName(sheetName);
  if(!channel)return;
  const ws=wb.Sheets[sheetName];if(!ws)return;
  const cell=addr=>{const c=ws[addr];return c?c.v:undefined;};
  const agent=(cell("B2")||"").toString().trim();
  if(!agent)return; // blank template sheet
  const evaluator=(cell("D2")||"").toString().trim();
  const role=(cell("B3")||"").toString().trim();
  const account=(cell("F2")||"").toString().trim();
  const interactionId=(cell("F3")!=null)?String(cell("F3")).trim():"";
  const interactionDate=excelCellDateToISO(cell("D3"));
  const evalDate=excelCellDateToISO(cell("D4"))||new Date().toISOString().slice(0,10);
  const schema=S.schema.channels[channel];if(!schema)return;
  const flatCriteria=schema.sections.flatMap(s=>s.criteria);
  if(flatCriteria.length!==rowNums.length)return; // rubric shape no longer matches the template — skip defensively
  const responses={};
  flatCriteria.forEach((c,i)=>{
   const r=rowNums[i],val=normalizeQAValue(cell("E"+r)),comment=cell("J"+r);
   const entry={};
   if(val)entry.value=val;
   if(comment)entry.comment=String(comment).trim();
   if(Object.keys(entry).length)responses[c.id]=entry;
  });
  const schemaSnapshot=JSON.parse(JSON.stringify(schema));
